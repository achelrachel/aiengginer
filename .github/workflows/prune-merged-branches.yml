name: Prune merged branches safely

# Keep main as the only active branch when all other work is merged.
# Never delete a branch with an open PR or with unique unmerged commits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove only merged or fully-ancestral branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, path):
              request = Request(base + ("/" + path if path else ""), headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None

          def all_pages(path):
              result = []
              for page in range(1, 11):
                  rows = api("GET", path + ("&" if "?" in path else "?")
                             + "per_page=100&page=" + str(page))
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
              raise RuntimeError("Pagination limit exceeded; refusing partial cleanup")

          repository = api("GET", "")
          if repository["default_branch"] != "main":
              raise RuntimeError("Default branch is not main; refusing cleanup")

          branches = all_pages("branches")
          merged = all_pages("pulls?state=closed")
          active = all_pages("pulls?state=open")
          open_names = {
              pr["head"]["ref"] for pr in active
              if pr["head"].get("repo") and
                 pr["head"]["repo"].get("full_name", "").lower() == repo.lower()
          }
          merged_heads = {
              (pr["head"]["ref"], pr["head"]["sha"])
              for pr in merged if pr.get("merged_at") and
              pr["head"].get("repo") and
              pr["head"]["repo"].get("full_name", "").lower() == repo.lower()
          }
          deleted = []
          skipped = []
          for branch in branches:
              name = branch["name"]
              original_sha = branch["commit"]["sha"]
              if name == "main" or branch["protected"] or name in open_names:
                  skipped.append(name)
                  continue
              merged_pr = (name, original_sha) in merged_heads
              fully_ancestor = False
              if not merged_pr:
                  comparison = api("GET", "compare/main..." + quote(name, safe="/"))
                  fully_ancestor = comparison.get("ahead_by") == 0
              if not (merged_pr or fully_ancestor):
                  skipped.append(name)
                  continue

              # Guard against a branch having been updated since inventory.
              current = api("GET", "git/ref/heads/" + quote(name, safe="/"))
              if current["object"]["sha"] != original_sha:
                  skipped.append(name)
                  continue
              api("DELETE", "git/refs/heads/" + quote(name, safe="/"))
              deleted.append(name)
              print("DELETED", name, "reason=" + ("merged PR" if merged_pr else "ancestor of main"))

          print("CLEANUP_RESULT", json.dumps({
              "repo": repo, "deleted": len(deleted), "kept": skipped,
          }, sort_keys=True))
          PY
